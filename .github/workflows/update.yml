name: Mise à jour quotidienne du pool
on:
  schedule:
    - cron: "0 11 * * *"   # 11h UTC = 7h (été) / 6h (hiver) au Québec, après les matchs de la veille
    - cron: "*/20 23,0-5 * * *"   # soirs de match : aux 20 min de 19h à 1h40 (été) ; ne publie que si les points changent
  workflow_dispatch:
concurrency: pool-update   # deux passages ne poussent jamais en même temps
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update_pool.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: |
          git config user.name "hockey-draft-bot"
          git config user.email "hockey-draft-bot@users.noreply.github.com"
          git add index.html history.json stats_prev.json phist.json flags.json page.sha.json
          git diff --cached --quiet || git commit -m "Stats du $(TZ=America/Toronto date +%F)"
          git pull --rebase -X theirs   # l app a pu synchroniser pendant l execution ; la page du robot l emporte
          git push
